# Every Monday: trend scout + recipe writer (Claude), screened by pennycheck,
# then published. Needs the ANTHROPIC_API_KEY repository secret.
name: Weekly recipes
on:
  schedule:
    - cron: "0 10 * * 1"     # Mondays 10:00 UTC (6am New York)
  workflow_dispatch:

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pennyplate/tools/requirements.txt
      - name: Build the checker
        run: swift build -c release --package-path pennyplate/validator
      - name: Write this week's recipes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pennyplate/tools/generate_recipes.py --checker pennyplate/validator/.build/release/pennycheck
      - name: Check the whole collection
        run: pennyplate/validator/.build/release/pennycheck check --catalog public/pennyplate/catalog.json --recipes public/pennyplate/recipes.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pennyplate/recipes.json
          git diff --cached --quiet || git commit -m "New recipes for the week of $(date -u +%F)"
          git push

  deploy:
    needs: generate
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
