# Every Monday: trend scout + recipe writer, screened by pennycheck, then
# published. Uses Gemini (free, GEMINI_API_KEY secret) or Claude
# (ANTHROPIC_API_KEY secret). Pick one with the RECIPE_AI repository variable
# ("gemini" or "claude"); without it, whichever key exists is used.
name: Weekly recipes
on:
  schedule:
    - cron: "7 10 * * 1"     # Mondays 10:07 UTC (6am New York)
  workflow_dispatch:
    inputs:
      ai:
        description: Which AI writes this run
        type: choice
        options: [default, gemini, claude]
        default: default

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  generate:
    # RECIPE_AI=routine: the Claude Code routine writes the recipes instead (see inbox.yml).
    if: github.event_name == 'workflow_dispatch' || vars.RECIPE_AI != 'routine'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pennyplate/tools/requirements.txt
      - name: Build the checker
        run: swift build -c release --package-path pennyplate/validator
      - name: Write this week's recipes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RECIPE_AI: ${{ (inputs.ai != '' && inputs.ai != 'default') && inputs.ai || vars.RECIPE_AI }}
        run: python pennyplate/tools/generate_recipes.py --checker pennyplate/validator/.build/release/pennycheck
      - name: Check the whole collection
        run: pennyplate/validator/.build/release/pennycheck check --catalog public/pennyplate/catalog.json --recipes public/pennyplate/recipes.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pennyplate/recipes.json
          git diff --cached --quiet || git commit -m "New recipes for the week of $(date -u +%F)"
          git push

  deploy:
    needs: generate
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
