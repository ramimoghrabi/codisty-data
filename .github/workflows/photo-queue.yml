# Finds Openverse photo options for recipes without a photo and leaves them in
# pennyplate/photo-inbox/ for the photo picker routine. Runs after new recipes
# are published (called by inbox.yml), and by hand to backfill.
name: Queue recipe photos
on:
  workflow_dispatch:
    inputs:
      retry:
        description: Search again now (broader) for recipes that found no good photo
        type: boolean
        default: false

concurrency:
  group: photo-queue          # its own queue, so it never bumps a waiting recipe batch
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Search Openverse
        run: python pennyplate/tools/photos.py queue --limit 150 ${{ inputs.retry && '--retry-now' || '' }}
      - name: Commit
        if: always()               # keep whatever was queued, even if a search failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pennyplate/photo-inbox
          git diff --cached --quiet || git commit -m "Photo options for $(date -u +%F)"
          git pull --rebase origin main && git push origin main
