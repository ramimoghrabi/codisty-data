# Recipes written by the weekly Claude Code routine arrive on a claude/recipes-*
# branch as pennyplate/inbox/candidates.json. Screen them with pennycheck,
# add the best five to main, publish, and delete the branch.
name: Recipes from the routine
on:
  push:
    branches: ["claude/recipes-*"]
    paths: ["pennyplate/inbox/candidates.json"]

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write          # to start the deploy on main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Take the candidates from the branch
        run: git show "${{ github.sha }}:pennyplate/inbox/candidates.json" > "$RUNNER_TEMP/candidates.json"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the checker
        run: swift build -c release --package-path pennyplate/validator
      - name: Screen and add the best five
        run: python pennyplate/tools/generate_recipes.py --checker pennyplate/validator/.build/release/pennycheck --candidates "$RUNNER_TEMP/candidates.json"
      - name: Check the whole collection
        run: pennyplate/validator/.build/release/pennycheck check --catalog public/pennyplate/catalog.json --recipes public/pennyplate/recipes.json
      - name: Commit to main and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pennyplate/recipes.json
          git diff --cached --quiet || git commit -m "New recipes for the week of $(date -u +%F) (from the routine)"
          git push origin main
          git push origin --delete "${GITHUB_REF_NAME}"
      # Pages only deploys from main, and this run belongs to the claude/ branch,
      # so start the deploy as its own run on main.
      - name: Publish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
